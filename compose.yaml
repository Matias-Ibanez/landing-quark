name: quark-frontend
services:
  web:
    build:
      context: .
      args:
        QUARK_API_URL: http://studio:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8010}:3000"
    networks:
      - quark-shared
    mem_limit: 1g
    cpus: 1
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]

networks:
  quark-shared:
    external: true
    name: quark-shared
